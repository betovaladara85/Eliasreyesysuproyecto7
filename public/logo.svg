<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0457B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC93C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3D2400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A3A1A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular oscuro -->
  <circle cx="200" cy="200" r="180" fill="url(#grad2)"/>
  
  <!-- Borde exterior dorado -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#FFC93C" stroke-width="4"/>
  
  <!-- Borde interior -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#FFC93C" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Guitarra estilizada -->
  <g transform="translate(200, 175)">
    <!-- Cuerpo de la guitarra -->
    <ellipse cx="0" cy="30" rx="45" ry="35" fill="none" stroke="url(#grad1)" stroke-width="3"/>
    <ellipse cx="0" cy="-15" rx="30" ry="22" fill="none" stroke="url(#grad1)" stroke-width="3"/>
    
    <!-- Boca de la guitarra -->
    <ellipse cx="0" cy="30" rx="15" ry="12" fill="none" stroke="#FFC93C" stroke-width="2"/>
    
    <!-- Cuello -->
    <rect x="-4" y="-80" width="8" height="65" rx="3" fill="url(#grad1)"/>
    
    <!-- Trastes -->
    <line x1="-4" y1="-65" x2="4" y2="-65" stroke="#FFC93C" stroke-width="1"/>
    <line x1="-4" y1="-50" x2="4" y2="-50" stroke="#FFC93C" stroke-width="1"/>
    <line x1="-4" y1="-35" x2="4" y2="-35" stroke="#FFC93C" stroke-width="1"/>
    <line x1="-4" y1="-20" x2="4" y2="-20" stroke="#FFC93C" stroke-width="1"/>
    
    <!-- Cuerdas -->
    <line x1="-2" y1="-80" x2="-2" y2="60" stroke="#FFC93C" stroke-width="0.8" opacity="0.6"/>
    <line x1="2" y1="-80" x2="2" y2="60" stroke="#FFC93C" stroke-width="0.8" opacity="0.6"/>
    
    <!-- Clavijero -->
    <rect x="-12" y="-95" width="24" height="15" rx="3" fill="url(#grad1)"/>
    <circle cx="-6" cy="-87" r="2" fill="#FFC93C"/>
    <circle cx="6" cy="-87" r="2" fill="#FFC93C"/>
    
    <!-- Notas musicales flotando -->
    <g opacity="0.8">
      <!-- Nota 1 -->
      <g transform="translate(-65, -40)">
        <circle cx="0" cy="0" r="6" fill="#E0457B"/>
        <line x1="6" y1="0" x2="6" y2="-25" stroke="#E0457B" stroke-width="2"/>
        <path d="M6,-25 Q15,-28 12,-20" fill="#E0457B"/>
      </g>
      <!-- Nota 2 -->
      <g transform="translate(60, -55)">
        <circle cx="0" cy="0" r="5" fill="#00A9A5"/>
        <line x1="5" y1="0" x2="5" y2="-22" stroke="#00A9A5" stroke-width="2"/>
        <path d="M5,-22 Q14,-25 11,-18" fill="#00A9A5"/>
      </g>
      <!-- Nota 3 -->
      <g transform="translate(-50, 50)">
        <circle cx="0" cy="0" r="4" fill="#FFC93C"/>
        <line x1="4" y1="0" x2="4" y2="-18" stroke="#FFC93C" stroke-width="1.5"/>
        <path d="M4,-18 Q12,-20 10,-14" fill="#FFC93C"/>
      </g>
      <!-- Nota doble -->
      <g transform="translate(55, 40)">
        <circle cx="0" cy="0" r="5" fill="#E0457B"/>
        <circle cx="14" cy="3" r="5" fill="#E0457B"/>
        <line x1="5" y1="0" x2="5" y2="-20" stroke="#E0457B" stroke-width="2"/>
        <line x1="19" y1="3" x2="19" y2="-17" stroke="#E0457B" stroke-width="2"/>
        <line x1="5" y1="-20" x2="19" y2="-17" stroke="#E0457B" stroke-width="2"/>
      </g>
    </g>
  </g>
  
  <!-- Texto "ELÍAS REYES" -->
  <text x="200" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" fill="#FFC93C" letter-spacing="3">ELÍAS REYES</text>
  
  <!-- Línea decorativa -->
  <line x1="110" y1="312" x2="290" y2="312" stroke="#E0457B" stroke-width="1.5"/>
  
  <!-- Texto "Proyecto 7" -->
  <text x="200" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#FFFAF0" letter-spacing="5" opacity="0.9">PROYECTO 7</text>
  
  <!-- Puntos decorativos -->
  <circle cx="130" cy="312" r="2" fill="#00A9A5"/>
  <circle cx="200" cy="312" r="2" fill="#00A9A5"/>
  <circle cx="270" cy="312" r="2" fill="#00A9A5"/>
  
  <!-- Texto inferior -->
  <text x="200" y="365" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#FFFAF0" opacity="0.5" letter-spacing="4">TRÍO MUSICAL • MÉRIDA, YUCATÁN</text>
</svg>